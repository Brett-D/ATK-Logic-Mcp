<!doctype html>
<html><head><meta charset="utf-8"><title>DL16 capture</title>
<style>
body{margin:0;background:#111;color:#ddd;font:13px system-ui,sans-serif}
#hdr{padding:6px 10px;background:#1b1b1b;border-bottom:1px solid #333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cid{color:#fff;font-weight:bold;margin-right:12px} #hint{color:#888;margin-left:12px}
canvas{display:block;cursor:crosshair}
</style></head><body>
<div id="hdr"><span id="cid"></span><span id="info"></span><span id="hint">wheel = zoom, drag = pan, double-click = reset</span></div>
<canvas id="c"></canvas>
<script>
const D=/*DATA*/null;
const cv=document.getElementById('c'),cx=cv.getContext('2d'),hdr=document.getElementById('hdr'),info=document.getElementById('info');
document.getElementById('cid').textContent=D.id;document.title=D.id;
const LW=210,ROW=34,AX=26;let W,H,t0=D.view?D.view[0]:0,t1=D.view?D.view[1]:D.n,mx=-1;
function fmt(s){const t=s/D.rate;return Math.abs(t)>=1e-3?(t*1e3).toFixed(3)+' ms':(t*1e6).toFixed(3)+' µs'}
function size(){W=document.documentElement.clientWidth;H=Math.max(innerHeight-hdr.offsetHeight,AX+ROW*D.chans.length+10);cv.width=W;cv.height=H;draw()}
function x2s(x){return t0+(x-LW)/(W-LW)*(t1-t0)} function s2x(s){return LW+(s-t0)/(t1-t0)*(W-LW)}
function first(c,s){let lo=0,hi=c.edges.length;while(lo<hi){const m=(lo+hi)>>1;if(c.edges[m]<=s)lo=m+1;else hi=m}return lo}
function level(c,s){return first(c,s)%2?1-c.init:c.init}
function draw(){
 cx.fillStyle='#111';cx.fillRect(0,0,W,H);
 const span=t1-t0;cx.strokeStyle='#2a2a2a';cx.fillStyle='#888';cx.font='11px monospace';
 for(let i=0;i<=10;i++){const x=LW+i*(W-LW)/10;cx.beginPath();cx.moveTo(x,AX-4);cx.lineTo(x,H);cx.stroke();cx.fillText(fmt(t0+i*span/10),x+2,12)}
 D.chans.forEach((c,i)=>{const y0=AX+i*ROW,yh=y0+6,yl=y0+ROW-8;
  cx.fillStyle=i%2?'#161616':'#141414';cx.fillRect(0,y0,W,ROW);
  cx.fillStyle='#ccc';cx.font='12px monospace';cx.fillText(('CH'+c.ch).padEnd(5)+' '+c.label,6,y0+15);
  cx.fillStyle='#777';cx.font='11px monospace';cx.fillText((c.high*100).toFixed(1)+'% high, '+c.edges.length+' edges',6,y0+28);
  cx.strokeStyle='#4c4';cx.lineWidth=1.3;cx.beginPath();
  const px=(W-LW)/span;let lv=level(c,t0),lastx=-1;cx.moveTo(LW,lv?yh:yl);
  for(let k=first(c,t0);k<c.edges.length&&c.edges[k]<=t1;k++){const ex=LW+(c.edges[k]-t0)*px;
   // Edges closer than half a pixel collapse into one vertical stroke.
   if(ex-lastx<0.5){cx.lineTo(ex,yh);cx.lineTo(ex,yl);lastx=ex;lv=1-lv;continue}
   cx.lineTo(ex,lv?yh:yl);lv=1-lv;cx.lineTo(ex,lv?yh:yl);lastx=ex}
  cx.lineTo(W,lv?yh:yl);cx.stroke();cx.lineWidth=1});
 if(mx>LW){cx.strokeStyle='#cc4';cx.beginPath();cx.moveTo(mx,AX);cx.lineTo(mx,H);cx.stroke()}
 const cur=mx>LW?'cursor '+fmt(Math.round(x2s(mx)))+'   ':'';
 info.textContent=(D.rate/1e6)+' MHz, '+D.n+' samples ('+fmt(D.n)+')'+(D.thr!=null?', threshold '+D.thr+' V':'')+'   '+cur+'view '+fmt(t1-t0);
}
let drag=null;
cv.addEventListener('wheel',e=>{e.preventDefault();const s=x2s(e.offsetX),f=e.deltaY>0?1.25:0.8;let a=s-(s-t0)*f,b=s+(t1-s)*f;if(b-a<20){a=s-10;b=s+10}t0=Math.max(0,a);t1=Math.min(D.n,b);draw()},{passive:false});
cv.addEventListener('mousedown',e=>drag={x:e.offsetX,a:t0,b:t1});
addEventListener('mouseup',()=>drag=null);
cv.addEventListener('mousemove',e=>{mx=e.offsetX;if(drag){const ds=(drag.x-e.offsetX)/(W-LW)*(drag.b-drag.a);let a=drag.a+ds,b=drag.b+ds;if(a<0){b-=a;a=0}if(b>D.n){a-=b-D.n;b=D.n}t0=a;t1=b}draw()});
cv.addEventListener('dblclick',()=>{t0=0;t1=D.n;draw()});
addEventListener('resize',size);size();
</script></body></html>
